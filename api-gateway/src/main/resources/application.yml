server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Rutas de autenticación
        - id: user-auth-service
          uri: http://user-auth-service:8081
          predicates:
            - Path=/api/auth/**

        # Rutas de autos
        - id: autos-service
          uri: http://autos-service:8082
          predicates:
            - Path=/api/autos/**

        # Ruta de documentación unificada del Gateway
        - id: openapi-service
          uri: http://autos-service:8082
          predicates:
            - Path=/v3/api-docs/**
          filters:
            - RewritePath=/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}
      
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedHeaders: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowCredentials: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Autos Service
        url: /v3/api-docs/autos-service