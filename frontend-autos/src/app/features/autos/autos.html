<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">Mi Catálogo de Autos</span>
    <button class="btn btn-outline-light btn-sm" (click)="logout()">Cerrar Sesión</button>
  </div>
</nav>

<div class="container">
  <div class="row">
    <!-- Formulario -->
    <div class="col-md-4 mb-4">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          {{ isEditing ? 'Editar Auto' : 'Registrar Nuevo Auto' }}
        </div>
        <div class="card-body">
          <form (ngSubmit)="saveAuto(autoForm)" #autoForm="ngForm">
            <div class="mb-2">
              <label>Placa</label>
              <input type="text" class="form-control" [(ngModel)]="currentAuto.plate" name="plate" required>
            </div>
            <div class="mb-2">
              <label>Marca</label>
              <select class="form-select" name="brand" [(ngModel)]="currentAuto.brand" required>
                <option value="" disabled selected>Selecciona una marca...</option>
                <option value="Mazda">Mazda</option>
                <option value="Toyota">Toyota</option>
                <option value="Chevrolet">Chevrolet</option>
                <option value="Renault">Renault</option>
                <option value="Ford">Ford</option>
              </select>
            </div>
            <div class="mb-2">
              <label>Modelo</label>
              <input type="text" class="form-control" [(ngModel)]="currentAuto.model" name="model" required>
            </div>
            <div class="mb-2">
              <label>Año</label>
              <input type="number" class="form-control" [(ngModel)]="currentAuto.year" name="year" required>
            </div>
            <div class="mb-2">
              <label>Color</label>
              <input type="text" class="form-control" [(ngModel)]="currentAuto.color" name="color" required>
            </div>
            <div class="mb-3">
              <label>Foto URL (Simulada)</label>
              <input type="text" class="form-control" [(ngModel)]="currentAuto.photo" name="photo">
            </div>
            <div class="alert alert-danger py-2" *ngIf="errorMessage">
              {{ errorMessage }}
            </div>
            <button type="submit" class="btn btn-success w-100" [disabled]="autoForm.invalid">{{ isEditing ? 'Actualizar' : 'Guardar' }}</button>
            <button type="button" class="btn btn-secondary w-100 mt-2" *ngIf="isEditing" (click)="resetForm(autoForm)">Cancelar</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Buscador y Tabla -->
    <div class="col-md-8">
      
      <!-- Panel de Filtros -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-4">
              <input type="text" class="form-control" placeholder="Buscar por placa o modelo..." [(ngModel)]="searchQuery" name="searchQuery">
            </div>
            <div class="col-md-3">
              <select class="form-select" name="searchBrand" [(ngModel)]="searchBrand">
                <option value="">Todas las marcas...</option>
                <option value="Mazda">Mazda</option>
                <option value="Toyota">Toyota</option>
                <option value="Chevrolet">Chevrolet</option>
                <option value="Renault">Renault</option>
                <option value="Ford">Ford</option>
              </select>
            </div>
            <div class="col-md-2">
              <input type="number" class="form-control" placeholder="Año" [(ngModel)]="searchYear" name="searchYear">
            </div>
            <div class="col-md-3 d-flex gap-2">
              <button type="button" class="btn btn-primary flex-grow-1" (click)="applyFilters()">Buscar</button>
              <button type="button" class="btn btn-outline-secondary" (click)="clearFilters()">X</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabla de Datos -->
      <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>Placa</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Año</th>
                <th>Color</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let auto of autos">
                <td><strong>{{ auto.plate }}</strong></td>
                <td>{{ auto.brand }}</td>
                <td>{{ auto.model }}</td>
                <td>{{ auto.year }}</td>
                <td>{{ auto.color }}</td>
                <td>
                  <button class="btn btn-sm btn-warning me-2" (click)="editAuto(auto)">Editar</button>
                  <button class="btn btn-sm btn-danger" (click)="deleteAuto(auto.id)">Eliminar</button>
                </td>
              </tr>
              <tr *ngIf="autos.length === 0">
                <td colspan="6" class="text-center py-4 text-muted">No hay autos registrados.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
