server.port=8081
spring.application.name=user-auth-service

spring.datasource.url=jdbc:sqlserver://sqlserver_db:1433;databaseName=AutosManagementDB;encrypt=false
spring.datasource.username=sa
spring.datasource.password=TuPasswordFuerte123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=users_schema

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=users_schema
spring.flyway.schemas=users_schema
spring.flyway.create-schemas=true

spring.flyway.check-location=false
spring.flyway.locations=classpath:db/migration

# Agregar esto al application.properties del user-auth-service Y del autos-service
security.jwt.secret-key=EstaEsUnaClaveSuperSecretaParaFirmarElJWT12345!